{% load i18n %}{% if form.non_field_errors %}
  <div class="alert alert-error form-errors" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% elif form.errors %}
  <div class="alert alert-error form-errors" role="alert">
    <p>{% translate "Please fix the highlighted fields below." %}</p>
  </div>
{% endif %}
